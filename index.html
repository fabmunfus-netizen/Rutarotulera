<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta de rótulos · Triana y Los Remedios</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f3ee;
  --surface: #ffffff;
  --text: #1f1d1a;
  --muted: #6b655c;
  --accent: #b5402a;
  --ok: #2e7d4f;
  --line: #e2dcd2;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1a18;
    --surface: #26241f;
    --text: #f1ede6;
    --muted: #a9a297;
    --accent: #e07a62;
    --ok: #6fc28f;
    --line: #3a372f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1a18;
  --surface: #26241f;
  --text: #f1ede6;
  --muted: #a9a297;
  --accent: #e07a62;
  --ok: #6fc28f;
  --line: #3a372f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
header {
  padding: 20px 16px 8px;
  max-width: 760px;
  margin: 0 auto;
}
h1 { font-size: 1.35rem; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
main { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }

.map-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px;
  margin: 12px 0 16px;
}
.map-wrap svg { width: 100%; height: auto; display: block; }
.map-caption { font-size: 0.8rem; color: var(--muted); padding: 4px 6px 2px; }

.stops { display: grid; gap: 8px; margin-bottom: 20px; }
.stop-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; font: inherit;
}
.stop-btn:hover { border-color: var(--accent); }
.stop-btn[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.num {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: 0.9rem;
}
.stop-name { font-weight: 600; }
.stop-addr { color: var(--muted); font-size: 0.85rem; }
.done { margin-left: auto; color: var(--ok); font-size: 0.85rem; white-space: nowrap; }

.ficha {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.ficha img { display: block; width: 100%; height: auto; }
.ficha-body { padding: 16px 18px 20px; }
.ficha h2 { font-size: 1.15rem; margin: 0 0 6px; }
.ficha .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
.ficha p { margin: 0 0 14px; }

.q { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.q h3 { font-size: 1rem; margin: 0 0 8px; }
.opt {
  display: block; width: 100%; text-align: left;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; margin-bottom: 6px; cursor: pointer; font: inherit;
}
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.opt.wrong { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.feedback { font-size: 0.9rem; min-height: 1.2em; margin: 4px 0 0; }
.feedback.ok { color: var(--ok); }
.feedback.ko { color: var(--accent); }

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.nav button {
  flex: 1; padding: 11px; border-radius: 10px; cursor: pointer; font: inherit;
  background: var(--surface); color: var(--text); border: 1px solid var(--line);
}
.nav button:disabled { opacity: 0.4; cursor: default; }
.nav button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

.end {
  text-align: center; padding: 24px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.end h2 { margin-top: 0; }
</style>
</head>
<body>
<header>
  <h1>Ruta de rótulos · Triana y Los Remedios</h1>
  <p>Cuatro paradas a pie. Mira la foto, lee la ficha y responde las preguntas.</p>
</header>

<main>
  <section class="map-wrap" aria-label="Mapa esquemático de la ruta">
    <svg id="map" viewBox="0 0 400 300" role="img" aria-label="Plano esquemático con las cuatro paradas y el trazado"></svg>
    <div class="map-caption">Plano esquemático, sin escala exacta. Las posiciones son las de cada dirección.</div>
  </section>

  <nav class="stops" id="stops" aria-label="Paradas de la ruta"></nav>

  <article class="ficha" id="ficha"></article>

  <div class="nav">
    <button id="prev" type="button">← Anterior</button>
    <button id="next" type="button" class="primary">Siguiente →</button>
  </div>
</main>

const state = { current: 0, answered: {} };

function project(lat, lon) {
  // Proyección local sencilla: x hacia el este, y hacia el norte, en km
  const lat0 = 37.379, lon0 = -6.0;
  const kx = Math.cos(lat0 * Math.PI / 180) * 111.32;
  const ky = 110.57;
  const x = (lon - lon0) * kx;
  const y = (lat - lat0) * ky;
  return { x, y };
}

function renderMap() {
  const svg = document.getElementById("map");
  const pts = STOPS.map(s => project(s.lat, s.lon));
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 40, W = 400, H = 300;
  const spanX = Math.max(maxX - minX, 0.01), spanY = Math.max(maxY - minY, 0.01);
  const scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
  const offX = (W - spanX * scale) / 2, offY = (H - spanY * scale) / 2;
  const sx = p => offX + (p.x - minX) * scale;
  const sy = p => H - (offY + (p.y - minY) * scale);
  const P = pts.map(p => ({ x: sx(p), y: sy(p) }));

  let path = "";
  P.forEach((p, i) => { path += (i ? " L " : "M ") + p.x.toFixed(1) + " " + p.y.toFixed(1); });

  let markers = "";
  P.forEach((p, i) => {
    const lx = p.x > W / 2 ? -14 : 14;
    const anchor = p.x > W / 2 ? "end" : "start";
    markers += `
      <circle cx="${p.x}" cy="${p.y}" r="13" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${p.x}" y="${p.y + 4.5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">${i + 1}</text>
      <text x="${p.x + lx}" y="${p.y + 4}" text-anchor="${anchor}" fill="var(--text)" font-size="11">${STOPS[i].name}</text>`;
  });

  svg.innerHTML = `
    <path d="${path}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/>
    ${markers}`;
}

function renderStops() {
  const nav = document.getElementById("stops");
  nav.innerHTML = STOPS.map((s, i) => {
    const total = s.questions.length;
    const done = Object.keys(state.answered).filter(k => k.startsWith(i + "-")).length;
    const status = done === total ? `<span class="done">✓ completada</span>` : "";
    return `
      <button class="stop-btn" type="button" data-i="${i}" aria-current="${i === state.current}">
        <span class="num">${i + 1}</span>
        <span>
          <span class="stop-name">${s.name}</span><br>
          <span class="stop-addr">${s.address}</span>
        </span>
        ${status}
      </button>`;
  }).join("");
  nav.querySelectorAll(".stop-btn").forEach(b => {
    b.addEventListener("click", () => { state.current = +b.dataset.i; render(); });
  });
}

function renderFicha() {
  const s = STOPS[state.current];
  const qs = s.questions.map((q, qi) => {
    const key = state.current + "-" + qi;
    const chosen = state.answered[key];
    const opts = q.options.map((o, oi) => {
      let cls = "opt";
      let dis = "";
      if (chosen !== undefined) {
        dis = "disabled";
        if (oi === q.correct) cls += " correct";
        else if (oi === chosen) cls += " wrong";
      }
      return `<button class="${cls}" ${dis} data-key="${key}" data-oi="${oi}">${o}</button>`;
    }).join("");
    let fb = "";
    if (chosen !== undefined) {
      fb = chosen === q.correct
        ? `<p class="feedback ok">${q.ok}</p>`
        : `<p class="feedback ko">${q.ko}</p>`;
    }
    return `
      <section class="q">
        <h3>${qi + 1}. ${q.q}</h3>
        ${opts}
        ${fb}
      </section>`;
  }).join("");

  document.getElementById("ficha").innerHTML = `
    <img src="${s.img}" alt="${s.alt}">
    <div class="ficha-body">
      <h2>${state.current + 1}. ${s.name}</h2>
      <div class="meta">${s.address}, Sevilla</div>
      <p>${s.text}</p>
      ${qs}
    </div>`;

  document.querySelectorAll("#ficha .opt").forEach(b => {
    b.addEventListener("click", () => {
      const key = b.dataset.key;
      state.answered[key] = +b.dataset.oi;
      render();
    });
  });
}

function renderEnd() {
  document.getElementById("ficha").innerHTML = `
    <div class="end">
      <h2>Fin de la ruta</h2>
      <p>Has visto las cuatro paradas. Puedes volver a cualquiera desde la lista.</p>
    </div>`;
}

function render() {
  renderMap();
  renderStops();
  renderFicha();
  document.getElementById("prev").disabled = state.current === 0;
  const last = state.current === STOPS.length - 1;
  const nextBtn = document.getElementById("next");
  nextBtn.textContent = last ? "Inicio" : "Siguiente →";
}

document.getElementById("prev").addEventListener("click", () => {
  if (state.current > 0) { state.current--; render(); }
});
document.getElementById("next").addEventListener("click", () => {
  if (state.current < STOPS.length - 1) { state.current++; render(); }
  else { state.current = 0; render(); }
});

render();
</script>
</body>
</html>
